<html>
    <body>
        <h2> JavaScript Objects and properties</h2>

        <p id="demo"></p>
        <script>
            // Create an object
            var person = {
                firstName:"Aarti",
                age: 20,
            };
            // Display some data from the object:
            document.getElementById("demo").innerHTML= "My Teacher " +person.firstName  + " is " + person.age + " years old";
        </script>
    </body>
</html>
